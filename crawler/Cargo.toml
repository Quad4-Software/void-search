[package]
name = "void-crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dashmap = "6.2.1"
ego-tree = "0.11.0"
futures = "0.3.34"
hex = "0.4.3"
landlock = "0.4.7"
parking_lot = "0.12.5"
rand = "0.10.3"
redb = "4.3.0"
reqwest = { version = "0.13.5", features = ["rustls", "gzip", "brotli", "deflate", "zstd", "cookies", "json", "stream", "charset", "query", "socks"] }
robotstxt = "0.3.0"
scraper = "0.27.0"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
tantivy = "0.26.2"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = "0.14.0"

[dev-dependencies]
futures = "0.3.34"
tempfile = "3.27.0"
