---
# yamllint disable rule:line-length
name: Sync

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# no GITHUB_TOKEN needed: pushes to Codeberg via its own credentials
permissions: {}

jobs:
  codeberg:
    # opt-in: set the CODEBERG_SYNC_ENABLED repo variable plus the
    # CODEBERG_USER / CODEBERG_TOKEN secrets to mirror to Codeberg
    if: vars.CODEBERG_SYNC_ENABLED == 'true'
    name: Codeberg
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Sync
        env:
          ORIGIN: "github.com/Quad4-Software/void-search"
          DESTINATION: "codeberg.org/quad4-software/void-search"
          DESTINATION_USER: "${{ secrets.CODEBERG_USER }}"
          DESTINATION_TOKEN: "${{ secrets.CODEBERG_TOKEN }}"
        run: |
          set -eu

          git init --quiet --bare .sync
          cd .sync

          git fetch --no-tags "https://${ORIGIN}.git" \
          '+refs/heads/master:refs/heads/master'

          git push --force "https://${DESTINATION_USER}:${DESTINATION_TOKEN}@${DESTINATION}.git" \
          'refs/heads/master:refs/heads/master'
