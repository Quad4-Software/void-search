---
name: Crawler
"on":
  push:
    branches:
      - master
    paths:
      - crawler/**
      - .github/workflows/crawler.yml
  pull_request:
    paths:
      - crawler/**
      - .github/workflows/crawler.yml

permissions:
  contents: read

concurrency:
  group: crawler-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt + clippy + test + build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crawler

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: "false"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            crawler/target
          key: crawler-${{ runner.os }}-${{ hashFiles('crawler/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets


      - name: release build
        run: cargo build --release


  image:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    if: github.event_name == 'push' && github.repository_owner == 'Quad4-Software'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
            platform: linux/arm64
          - runner: ubuntu-26.04-arm
            arch: armv7
            platform: linux/arm/v7

    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: "false"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: crawler-img-${{ runner.arch }}-${{ hashFiles('crawler/Cargo.lock') }}

      - name: Build image
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          mkdir -p /var/tmp/void-crawler
          podman build --format=oci --layers --platform "$PLATFORM" \
            --identity-label=false \
            -f crawler/Dockerfile -t "localhost/void-crawler:$ARCH" .
          podman save --format=oci-archive \
            --output "/var/tmp/void-crawler/image_$ARCH.tar" \
            "localhost/void-crawler:$ARCH"
          ls -lh /var/tmp/void-crawler/

      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: crawler-image-${{ matrix.arch }}
          path: /var/tmp/void-crawler/*.tar
          if-no-files-found: error
          retention-days: 1

  image-release:
    name: Publish crawler image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [rust, image]
    if: github.ref == 'refs/heads/master' && github.repository_owner == 'Quad4-Software'

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: "false"
          fetch-depth: "0"

      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: crawler-image-*
          path: /var/tmp/void-crawler
          merge-multiple: true

      - name: Push manifest
        env:
          DOCKER_TAG: ${{ github.run_number }}
        run: |
          set -e
          repo="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/void-crawler"
          tag="$(git show -s --date=format:%Y.%m.%d --format=%cd-%h)"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "IMAGE=${repo}" >> "$GITHUB_ENV"

          podman manifest rm --ignore "localhost/void-crawler:${tag}" "localhost/void-crawler:latest"
          for t in "${tag}" latest; do
            podman manifest create "localhost/void-crawler:${t}"
            for f in /var/tmp/void-crawler/*.tar; do
              podman manifest add "localhost/void-crawler:${t}" "oci-archive:${f}"
            done
            podman manifest push --all --compression-format zstd \
              "localhost/void-crawler:${t}" "docker://${repo}:${t}"
          done

      - name: Smoke test image
        run: |
          set -e
          podman run --rm --platform linux/amd64 \
            "ghcr.io/quad4-software/void-crawler:${TAG}" --help | grep -q "crawl"
          echo "image smoke ok"

      - name: Resolve image digest
        id: digest
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          fi
          image="ghcr.io/quad4-software/void-crawler"
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://${image}:${TAG}")
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        env:
          COSIGN_YES: "true"
          IMAGE: ${{ steps.digest.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: "${{ steps.digest.outputs.image }}@${{ steps.digest.outputs.digest }}"
          output-file: crawler-sbom.spdx.json

      - name: Attest SLSA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: "${{ steps.digest.outputs.image }}"
          subject-digest: "${{ steps.digest.outputs.digest }}"
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: "${{ steps.digest.outputs.image }}"
          subject-digest: "${{ steps.digest.outputs.digest }}"
          sbom-path: "crawler-sbom.spdx.json"
          push-to-registry: true
