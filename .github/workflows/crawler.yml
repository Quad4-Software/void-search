---
name: Crawler
"on":
  push:
    branches:
      - master
    paths:
      - crawler/**
      - .github/workflows/crawler.yml
  pull_request:
    paths:
      - crawler/**
      - .github/workflows/crawler.yml

permissions:
  contents: read

concurrency:
  group: crawler-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt + clippy + test + build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crawler

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6292f8e5b7b5e5e9463e34b41ce459183e196b1  # v2.14.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: "false"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            crawler/target
          key: crawler-${{ runner.os }}-${{ hashFiles('crawler/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

      - name: release build
        run: cargo build --release
