# Docker Compose definition for Void Search on Coolify.
#
# In Coolify create an Application from this repository, select the Docker
# Compose build pack and set the Docker Compose Location to
# docker-compose.coolify.yml. Set the public domain on the "ravenguard"
# service's Domains field, including the container port it exposes:
#
#   https://search.example.com:8080
#
# Request flow: client -> Coolify proxy -> ravenguard (WAF) -> void -> engines.
# Only ravenguard is exposed; void and valkey stay on the internal network.
#
# Variables written as ${NAME:-default} become editable environment variables
# in Coolify. ${NAME:?} marks the variable as required: set RG_CHALLENGE_SECRET
# (min 16 chars) in Coolify's environment editor before the first deploy. The
# SearXNG secret key needs no variable because the entrypoint generates one on
# first boot and stores it in the void-config volume.
#
# For a plain self-hosted stack without Coolify, use docker-compose.yml.

name: void-search

services:
  ravenguard:
    image: ghcr.io/quad4-software/ravenguard:${RAVENGUARD_VERSION:-edge}
    restart: unless-stopped
    # public entry point - Coolify routes the domain to this port
    expose:
      - "8080"
    environment:
      RG_CHALLENGE_SECRET: ${RG_CHALLENGE_SECRET:?}
      RG_UPSTREAM_URL: ${RG_UPSTREAM_URL:-http://void:8080}
      RG_SITE_PUBLIC_URL: ${RG_SITE_PUBLIC_URL:-}
      # the Coolify proxy connects from the Docker network, not the public edge
      RG_TRUST_MODE: ${RG_TRUST_MODE:-behind_proxy}
      RG_TRUSTED_PROXIES: ${RG_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.0/8,fc00::/7}
      RG_REAL_IP_HEADER: ${RG_REAL_IP_HEADER:-X-Forwarded-For}
      RG_PROTO_HEADER: ${RG_PROTO_HEADER:-X-Forwarded-Proto}
      RG_SANDBOX_MODE: ${RG_SANDBOX_MODE:-best_effort}
      RG_LOG_LEVEL: ${RG_LOG_LEVEL:-warn}
    tmpfs:
      - /data:size=64m
    # mount directories, not the file: Coolify turns file bind sources
    # into empty directories (upstream bug), which breaks -config
    volumes:
      - ./container/ravenguard:/config:ro
      - ./container/ravenguard/blocklists:/blocklists:ro
    depends_on:
      void:
        condition: service_healthy
    command: ["-config", "/config/ravenguard.toml"]

  void:
    image: ghcr.io/quad4-software/void-search:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    # internal only - reached through ravenguard, no expose and no host port
    environment:
      SEARXNG_VALKEY_URL: ${SEARXNG_VALKEY_URL:-valkey://valkey:6379/0}
      SEARXNG_LIMITER: ${SEARXNG_LIMITER:-true}
      SEARXNG_PUBLIC_INSTANCE: ${SEARXNG_PUBLIC_INSTANCE:-false}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
      SEARXNG_IMAGE_PROXY: ${SEARXNG_IMAGE_PROXY:-true}
      SEARXNG_ENGINE_POLICY: ${SEARXNG_ENGINE_POLICY:-true}
    volumes:
      - void-config:/etc/searxng
      - void-data:/var/cache/searxng
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  void-config:
  void-data:
  valkey-data:
