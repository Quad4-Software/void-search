name: void

services:
  ravenguard:
    image: ghcr.io/quad4-software/ravenguard:edge
    container_name: void-edge
    restart: unless-stopped
    depends_on:
      void:
        condition: service_started
    ports:
      - "${VOID_HOST:-127.0.0.1}:${VOID_PORT:-48731}:8080"
    environment:
      RG_CHALLENGE_SECRET: "${RG_CHALLENGE_SECRET:-rg-void-change-me-please!!}"
      RG_SANDBOX_MODE: best_effort
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /data:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 384m
    volumes:
      - ./container/ravenguard:/config:ro
      - ./container/ravenguard/blocklists:/blocklists:ro
    command: ["-config", "/config/ravenguard.toml"]

  void:
    image: ghcr.io/quad4-software/void-search:${SEARXNG_VERSION:-latest}
    container_name: void
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_started
    expose:
      - "8080"
    environment:
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://127.0.0.1:48731/}"
      SEARXNG_LIMITER: "true"
      SEARXNG_PUBLIC_INSTANCE: "true"
      SEARXNG_VALKEY_URL: "valkey://valkey:6379/0"
      SEARXNG_IMAGE_PROXY: "true"
      GRANIAN_WORKERS: "${GRANIAN_WORKERS:-4}"
      GRANIAN_BLOCKING_THREADS: "8"
      GRANIAN_BACKPRESSURE: "128"
      GRANIAN_RUNTIME_THREADS: "2"
      GRANIAN_ACCESS_LOG: "false"
      GRANIAN_LOG_LEVEL: "error"
      MALLOC_ARENA_MAX: "2"
      THEVOID_API_URL: "${THEVOID_API_URL:-http://crawler:8088}"
      HISTER_API_URL: "${HISTER_API_URL:-}"
      HISTER_TOKEN: "${HISTER_TOKEN:-}"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: 1536m
    user: "65532:65532"
    volumes:
      - ./config:/etc/searxng:Z
      - void-data:/var/cache/searxng

  crawler:
    image: ghcr.io/quad4-software/void-crawler:latest
    # uncomment to build from source instead of pulling
    # build:
    #   context: .
    #   dockerfile: crawler/Dockerfile
    container_name: void-crawler
    restart: unless-stopped
    profiles:
      - crawler
    command: ["run"]
    environment:
      VC_LISTEN: "0.0.0.0:8088"
      VC_DATA_DIR: "/data"
      VC_FLARESOLVERR: "${VC_FLARESOLVERR:-}"
      VC_HISTER_URL: "${VC_HISTER_URL:-}"
      VC_HISTER_TOKEN: "${VC_HISTER_TOKEN:-}"
      RUST_LOG: info
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1536m
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - crawler-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    # valkey is ephemeral rate-limit state only - no persistence, no fork,
    # so vm.overcommit_memory is a no-op (it is a host-level sysctl anyway)
    container_name: void-valkey
    restart: unless-stopped
    command: valkey-server --save "" --appendonly no --protected-mode yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 160m
    user: "65532:65532"
    volumes:
      - valkey-data:/data

volumes:
  void-data:
  valkey-data:
  crawler-data:
