# https://docs.astral.sh/ruff/configuration/

target-version = "py311"
line-length = 120

# injected by searx.engines at runtime, see .pylintrc additional-builtins
builtins = ["traits", "logger", "categories"]

# searxng.msg and docs_prebuild are Python sources without a .py suffix
include = [
    "*.py",
    "*.pyi",
    "*.ipynb",
    "**/searxng.msg",
    "**/docs_prebuild",
]

exclude = [
    "searx/static",
    "searx/languages.py",
    "local",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PTH",  # flake8-use-pathlib
    "PERF", # perflint
    "TID",  # flake8-tidy-imports
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "PGH",  # pygrep-hooks
    "FLY",  # flynt (f-strings)
    "T10",  # flake8-debugger
    "DTZ",  # flake8-datetimez
    "S",    # flake8-bandit
]
ignore = [
    "PGH003", # blanket type: ignore comments are the codebase convention; per-rule codes are not tracked
]

[lint.isort]
known-first-party = ["searx", "searxng_extra", "tests"]

[lint.per-file-ignores]
"searx/webapp.py" = ["E402"] # app is configured between imports on purpose
"tests/**" = ["S101"]

[format]
quote-style = "preserve"
