<fieldset>{{- '' -}}
  <legend id="pref_method"><span class="pref-label">{{- _('HTTP Method') -}}</span></legend>{{- '' -}}
  <div class="value">{{- '' -}}
    <select name='method' aria-labelledby="pref_method">{{- '' -}}
      <option value="POST"
              {%- if method == 'POST' %} selected="selected"{%- endif -%}>POST{{- '' -}}
      </option>{{- '' -}}
      <option value="GET"
              {%- if method == 'GET' %} selected="selected"{%- endif -%}>GET{{- '' -}}
      </option>{{- '' -}}
    </select>{{- '' -}}
  </div>{{- '' -}}
  <div class="description">
    {{- _('POST keeps the query out of the address bar and server access logs. GET is needed by some browsers for the search bar.') -}}
  </div>{{- '' -}}
</fieldset>{{- '' -}}
